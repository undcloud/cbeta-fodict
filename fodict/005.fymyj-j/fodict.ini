2. 阿罗诃 = 　　秦云应供。大论云：应受一切天地众生供养。亦翻杀贼，又翻不生。观经疏云：天竺三名相近，阿罗诃，翻应供；阿罗汉，翻无生；阿卢汉，翻杀贼。
3. 三藐三佛陀 = 　　亦云三耶三菩。秦言正遍知。大论云：是言正遍知一切法。什师言正遍觉也。言法无差故言正；智无不周故言遍；出生死梦故言觉。妙宗云：此之三号，即名三德。今就所观，义...
4. 鞞侈遮罗那三般那 = 　　秦言明行足。大论云：宿命、天眼、漏尽，名为三明。三乘虽得三明，明不满足，佛悉满足，是为异也，具足三明及六神通。智论云：一如意、二天眼、三天耳、四他心、五识宿...
5. 修伽陀 = 　　秦言好去。大论云：于种种诸深三摩提，无量智慧中去。或名修伽度。此云善逝。菩萨地持经云：第一上升，永不复还，故名善逝。