3. 一人当千 = 　（杂语）以一人之力当千人。涅槃经二曰：“譬如人王有大力士，其力当千，更无有能降伏之者，故称此人一人当千。”
4. 一刀三礼 = 　（杂语）雕刻佛像，每下一刀，须礼拜三宝三次。画像经文，谓之一笔三礼，又曰：一字三礼。
5. 一大宅 = 　（譬喻）以长者之一大宅，譬三界之火宅。法华经譬喻品曰：“譬如长者有一大宅。”<SEEALSO>火宅</SEEALSO>