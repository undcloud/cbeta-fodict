5. 九识 = 从眼至意为六。前已具言。第七阿陀那识。第八阿黎耶识。第九阿磨罗识。通前是为九。何名为阿陀那者。此西域语。以义言之。我见之识。凡夫我见依此识起。障无我智令不得生。...