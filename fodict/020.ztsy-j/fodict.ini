1. 师资 = 《老氏》曰“善人，不善人之师；不善人，善人之资。”《说者》曰“善人，有不善人，然后善救之功著，故曰‘资’。”
2. 喻筏 = 房越切，正作机说。文云“海中大船也”，亦作筏。《金刚般若》曰“如来常说汝等说法，如筏喻者，法尚应舍，何况非法。”
3. 止啼 = 譬如婴儿啼哭之时，父母即以杨树黄叶而语之言：“莫啼莫啼！我与汝金。”婴儿见巳，生真金想，便止，不啼，然此杨叶实非金也。见《涅盘经》。
4. 忘筌 = 《易略》例曰“言者所以明象，得象而忘言；象者所以存意，得意而忘象；犹蹄者所以在兔，得兔而忘蹄；筌者所以在鱼，得鱼而忘筌也。然则言者，象之蹄也；象者，意之筌也。存...
