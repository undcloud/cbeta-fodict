description = 這是一部依龍樹菩薩所著《大智度論》編輯的辭典，另外加入了印順法師《大智度論筆記》裏的圖表，以使法義更容易明白。製作這部辭典的目的是為了輔助學習三十卷的《摩訶般若波羅蜜經》和龍樹菩薩所造《大智度論》。  每個名詞的解釋分成三類： 一、經文和論文： 	【經】：標明這是經文，也就是三十卷《摩訶般若波羅蜜經》裡的文； 	【論】：標明這是論文，也就是龍樹菩薩所造的論文。	 二、相關的名詞（連接）：這有多種標記，主要如下： 	【見】：解釋這個名詞或相關論文内容的名詞。 	【屬於】：例如「不殺生」屬於「五戒」。 	【對比】：和這個名詞有相對、相反意思的名詞。 	【異名】：和這個名詞有相同意思的名詞。 	【對治】：如何對治。 	【空義】：中觀一切法空的見解。 	【三昧】：相關的三昧。 	【波羅蜜】：相關的波羅蜜。 	【十地】：菩薩十地裏的相關成就。 	【菩薩】：菩薩道所行。 	【新學】：這是屬於新學、初發意等菩薩。 	【不退】：這是屬於不退轉菩薩。 	【佛】：這是佛的功德和成就等的名詞。 	【相關】：和這個名詞有（其他）關聯的名詞。 	【編註】：這是編者的註明。 三、所有未標註的圖表都是取自印順導師所著《大智度論筆記》。另外， 	【印老筆記】：這是印順導師所作的筆記。  這部辭典在很多方面還有待改善，所以如果您發現什麽錯誤，或者有什麽建議，還請勞煩您以電郵通知。我的電郵地址是：ruqing@gmail.com。感恩！  謹此希望般若法門能廣泛流傳世間，一切眾生都能究竟到彼岸！
