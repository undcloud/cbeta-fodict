[sample_entries]
1. 一灭 = 一个宣示寂灭（涅槃境界）才是芸芸众生最理想、最美丽的归宿的真理，也就是四圣谛中之“灭谛”。
2. 一地 = （喻）佛性好像一块土地。土地能使一切草木的种子生根发芽，而佛性也能使一切众生的善根功德增长壮大。
3. 一异 = 一与异。彼此相同叫做“一”，彼此各异叫做“异”。一与异，都是偏于一边的思想。中论说：“不生亦不灭，不常亦不断，不一亦不异，不来亦不去。”
4. 一灯 = （喻）智慧好像一盏明灯。明灯能破除一切的黑暗，而智慧也能破除一切的愚痴。华严经说：“譬如一灯入于暗室，百千年暗悉能破尽。”
5. 一时 = 　　1、指佛于某地说法之时。诸经之首皆有“如是我闻，一时佛在……”一语。 　　2、指佛说法之时，亦即师资道合，机教相叩之时。